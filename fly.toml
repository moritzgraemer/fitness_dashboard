# Fly.io-Konfiguration für das Fitness-Dashboard
#
# Beim Start über die Weboberfläche ("Launch an App from GitHub") setzt Fly den
# App-Namen selbst; der Wert hier ist nur ein Platzhalter. Beim Start über die
# Kommandozeile vorher `fly apps create <name>` ausführen und hier eintragen.
app = "fitness-dashboard"
primary_region = "cdg"          # Paris – alternativ "fra" (Frankfurt)

[build]

# Nicht geheime Einstellungen. Zugangsdaten gehören NICHT hierher, sondern als
# Secret (verschlüsselt) in die App – siehe README.md.
[env]
  V2_HOST = "0.0.0.0"
  V2_PORT = "8080"
  V2_DEBUG = "0"
  V2_NO_BROWSER = "1"
  TZ = "Europe/Berlin"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # Maschine schläft bei Inaktivität → kaum Kosten
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

# Die "Datenbank" dieser App sind CSV-Dateien in diesem Verzeichnis: Aktivitäten,
# Körperdaten, Runden, Check-ins, Verletzungen, Makroplan und der Garmin-Token.
# Sie liegen auf einem persistenten Volume, damit sie ein Deploy überleben.
# Eine SQL-Datenbank (Postgres) wird NICHT gebraucht.
#
# Volume einmalig anlegen – gleiche Region wie primary_region:
#   fly volumes create fitness_data --size 1 --region cdg --app <name>
[mounts]
  source = "fitness_data"
  destination = "/app/datenbanken"

# pandas und numpy brauchen Arbeitsspeicher: 256 MB reichen nicht, die Maschine
# würde beim Laden der Daten abstürzen. 1 GB ist der praktikable Wert.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
